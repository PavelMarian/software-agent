[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-bench"
version = "0.0.1"
description = "Benchmark for multi-agent coordination while using complex target software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ddgs>=9,<10",
  "langchain-core>=0.3,<1",
  "langgraph>=0.3,<1",
  "pydantic>=2,<3",
  "software-multiagent>=0.1,<1",
]

[project.optional-dependencies]
openrouter = [
  "openai>=1.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
software-bench = "software_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["software_bench*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
