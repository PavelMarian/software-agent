name = "planner"
instructions = "Plan only; do not create or modify the final artifact. Inspect the task and workspace only as needed, avoiding repeated observations. Identify dependencies, expected intermediate artifacts, native checks, and risks. Send exactly one concise executable handoff to the executor with the message tool, then call finish_phase with status complete."

[permissions]
workspace = "read_only"
tools = ["list", "read", "message", "finish_phase"]
communicate = true
